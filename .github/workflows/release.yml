name: release

# Publish to PyPI on version tags (vX.Y.Z), via Trusted Publishing (OIDC)
# — no API token is stored anywhere: PyPI trusts this workflow directly.
#
# One-time setup (see PUBLISH.md):
#   GitHub: Settings → Environments → create "pypi"
#   PyPI:   project → Publishing → add trusted publisher:
#           cine-labs / cine-rec-engine / release.yml / environment "pypi"
#
# Then every release is just:
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# a tag publishes exactly once — never race two runs for the same ref
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,serve]" build
      - name: Offline suite — release gate
        run: pytest -q
      - name: Tag, pyproject, and package versions must agree
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          PKG="$(python -c 'import cine_rec_engine; print(cine_rec_engine.__version__)')"
          echo "tag=$TAG pyproject=$PY package=$PKG"
          test "$TAG" = "$PY"
          test "$TAG" = "$PKG"
      - name: Build sdist + wheel
        run: python -m build
      - name: Smoke the built wheel (we publish what we test)
        run: |
          python -m venv /tmp/wheelvenv
          # expand the glob separately — "dist/*.whl[serve]" as one word is
          # a glob that matches nothing and pip gets the literal string
          WHEEL=$(ls dist/*.whl | head -1)
          /tmp/wheelvenv/bin/pip install "$WHEEL[serve]"
          /tmp/wheelvenv/bin/python - <<'PY'
          import pathlib
          import cine_rec_engine
          from cine_rec_engine import serve

          pkg = pathlib.Path(cine_rec_engine.__file__).parent
          assert (pkg / "weights.json").exists(), "weights.json missing from the wheel"
          assert (pkg / "sql" / "schema.sql").exists(), "sql/schema.sql missing from the wheel"
          app = serve.create_app(service=object())
          paths = {getattr(r, "path", "") for r in app.routes}
          assert {"/health", "/v1/similar",
                  "/v1/gorse/recommend/{user_id}"} <= paths, sorted(paths)
          print("wheel smoke ok:", cine_rec_engine.__version__)
          PY
      - name: Distributions
        run: ls -l dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # Official container image — same tag gate as PyPI (vX.Y.Z), but
  # independent of Trusted Publishing so a PyPI config mismatch cannot
  # block GHCR.
  # Consumers: docker pull ghcr.io/dovberkaplan/cine-rec-engine:X.Y.Z
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image tags from the git tag
        id: meta
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/dovberkaplan/cine-rec-engine" >> "$GITHUB_OUTPUT"
      - name: Tag and pyproject versions must agree
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          PKG="$(grep -E '^__version__\s*=' cine_rec_engine/__init__.py | head -1 | cut -d'"' -f2)"
          echo "tag=$TAG pyproject=$PY package=$PKG"
          test "$TAG" = "$PY"
          test "$TAG" = "$PKG"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
